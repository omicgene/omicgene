name: "✨ Feature / Model Request"
description: "Suggest a new feature, machine learning architecture, variant caller, or genomic analysis capability."
title: "[FEAT]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new computational models, analytical pipelines, and tooling.
  - type: textarea
    id: motivation
    attributes:
      label: Research Motivation / Problem Statement
      description: What challenge or scientific bottleneck does this feature address?
      placeholder: Describe the biological or computational problem...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Architecture
      description: Detailed explanation of how this should work (e.g. model architecture, loss functions, API design).
      placeholder: Describe the proposed approach, algorithms, or external tools...
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Scientific Literature / Precedents
      description: Relevant papers, DOIs, or existing benchmark implementations.
      placeholder: e.g. DOI: 10.1038/..., GitHub link, etc.
    validations:
      required: false
